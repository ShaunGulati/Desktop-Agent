name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The core links a Swift package and uses AppKit, so every check runs on macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify (types, tests, lint, Swift)
        run: pnpm verify
